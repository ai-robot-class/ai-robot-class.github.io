services:
  dev:
    build: .
    image: airobot-class/p02-voice-turtle:latest
    container_name: p02-voice-turtle
    network_mode: host
    privileged: false
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      # - /dev/snd:/dev/snd  # 取消注释以启用 /dev/snd
    # 取消注释下面的设备和卷映射以使用真实硬件
    # devices:
    #   - /dev/snd

    stdin_open: true
    tty: true
    command: /bin/bash
