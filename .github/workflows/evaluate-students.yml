name: 学生作业自动评价

on:
  schedule:
    # 每24小时运行一次（北京时间每天22:00，UTC 14:00）
    - cron: '0 14 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  evaluate-student-repos:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检查运行日期
        id: check_date
        run: |
          END_DATE="2026-06-22"
          CURRENT_DATE=$(date +%Y-%m-%d)
          if [[ "$CURRENT_DATE" > "$END_DATE" ]]; then
            echo "⏰ 评价已结束（截止日期：$END_DATE）"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "✅ 继续运行评价（当前：$CURRENT_DATE，截止：$END_DATE）"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout课程仓库
        if: steps.check_date.outputs.should_run == 'true'
        uses: actions/checkout@v4
        
      - name: 设置Python环境
        if: steps.check_date.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 安装依赖
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          pip install requests PyGithub pandas markdown2
          
      - name: 运行评价脚本
        if: steps.check_date.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/evaluate_students.py
        
      - name: 生成评价报告
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          python scripts/generate_report.py
          
      - name: 提交更新
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add students/
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 自动更新学生作业评价 $(date +'%Y-%m-%d %H:%M')"
          git push
