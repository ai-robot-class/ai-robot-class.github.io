services:
  dev:
    build: .
    image: airobot-class/p02-voice-turtle:latest
    container_name: p02-voice-turtle
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
    devices:
      - /dev/snd
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/snd:/dev/snd
    stdin_open: true
    tty: true
    command: /bin/bash
