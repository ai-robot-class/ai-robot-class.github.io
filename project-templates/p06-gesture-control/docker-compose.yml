services:
  dev:
    build: .
    image: airobot-class/p06-gesture-control:latest
    container_name: p06-gesture-control
    network_mode: host
    privileged: false
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      # - /dev/video0:/dev/video0  # 取消注释以启用 /dev/video0
    # 取消注释下面的设备和卷映射以使用真实硬件
    # devices:
    #   - /dev/video0

    stdin_open: true
    tty: true
    command: /bin/bash
