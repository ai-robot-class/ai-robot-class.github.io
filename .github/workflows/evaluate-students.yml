name: 学生作业自动评价

on:
  schedule:
    # 每24小时运行一次（北京时间每天22:00，UTC 14:00）
    - cron: '0 14 * * *'
  push:
    branches:
      - main
    paths:
      - 'students/roster.json'
      - 'scripts/**'
      - '.github/workflows/evaluate-students.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 检查运行日期
        id: check_date
        run: |
          END_DATE="${EVALUATION_END_DATE:-2026-07-31}"
          CURRENT_DATE=$(date +%Y-%m-%d)
          if [[ "$CURRENT_DATE" > "$END_DATE" ]]; then
            echo "⏰ 评价已结束（截止日期：$END_DATE）"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "✅ 继续运行评价（当前：$CURRENT_DATE，截止：$END_DATE）"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi
        env:
          EVALUATION_END_DATE: ${{ vars.EVALUATION_END_DATE }}

      - name: Checkout
        if: steps.check_date.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: steps.check_date.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: steps.check_date.outputs.should_run == 'true'
        run: pip install requests

      - name: 运行评价脚本
        if: steps.check_date.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EVALUATION_END_DATE: ${{ vars.EVALUATION_END_DATE }}
        run: python scripts/evaluate_students.py

      - name: 提交更新
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add students/
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "🤖 自动更新学生作业评价 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
