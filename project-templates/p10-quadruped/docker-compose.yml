services:
  dev:
    build: .
    image: airobot-class/p10-quadruped:latest
    container_name: p10-quadruped
    network_mode: host
    privileged: false
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix


    stdin_open: true
    tty: true
    command: /bin/bash
