name: Deploy GitBook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitBook
        run: |
          # 临时将 students/index.html 移出，避免 honkit 当成 markdown 解析
          mkdir -p /tmp/students-static
          cp -r students/index.html /tmp/students-static/index.html
          cp -r students/roster.json /tmp/students-static/roster.json
          cp -r students/evaluations /tmp/students-static/evaluations 2>/dev/null || true
          rm -f students/index.html students/roster.json
          rm -rf students/evaluations

          # 构建 honkit 站点
          npm run build
          touch _book/.nojekyll

          # 把静态文件复制到 _book/students/
          mkdir -p _book/students/evaluations
          cp /tmp/students-static/index.html _book/students/index.html
          cp /tmp/students-static/roster.json _book/students/roster.json
          cp -r /tmp/students-static/evaluations/. _book/students/evaluations/ 2>/dev/null || true

          # 恢复原始文件（以便后续 step 使用）
          cp /tmp/students-static/index.html students/index.html
          cp /tmp/students-static/roster.json students/roster.json
          mkdir -p students/evaluations
          cp -r /tmp/students-static/evaluations/. students/evaluations/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
