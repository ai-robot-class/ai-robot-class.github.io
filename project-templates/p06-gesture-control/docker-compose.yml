services:
  dev:
    build: .
    image: airobot-class/p06-gesture-control:latest
    container_name: p06-gesture-control
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
    devices:
      - /dev/video0
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/video0:/dev/video0
    stdin_open: true
    tty: true
    command: /bin/bash
