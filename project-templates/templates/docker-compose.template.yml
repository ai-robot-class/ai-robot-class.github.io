services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: airobot-class/PROJECT_NAME:latest
    container_name: PROJECT_NAME-dev
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
    volumes:
      # 项目代码挂载（实时同步，无需重建镜像）
      - .:/workspace
      # GUI X11 转发
      - /tmp/.X11-unix:/tmp/.X11-unix
      # 摄像头（如需）
      - /dev/video0:/dev/video0
      # 麦克风（如需）
      - /dev/snd:/dev/snd
    devices:
      - /dev/video0
      - /dev/snd
    stdin_open: true
    tty: true
    command: /bin/bash
